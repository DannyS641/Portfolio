<script>
  // Decided before paint so the boot screen never flashes a scrollable page behind it.
  (function () {
    var seen = false
    try { seen = sessionStorage.getItem('nifemi-boot') === '1' } catch (e) {}
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    window.__shouldBoot = !seen && !reduced
    if (window.__shouldBoot) document.documentElement.classList.add('booting')
  })()
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
